<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <linearGradient id="cosmicBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06091e"/>
      <stop offset="50%" stop-color="#0c133a"/>
      <stop offset="100%" stop-color="#070a22"/>
    </linearGradient>
    <linearGradient id="cosmicPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090e2a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <defs>
    <linearGradient id="bg6b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="16" fill="url(#cosmicBg)" stroke="url(#neonBorder)" stroke-width="2"/>
  
  <!-- Left: Curva de Potencial de Acción -->
  <rect x="20" y="20" width="370" height="320" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="205" y="45" fill="#a78bfa" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Potencial de Membrana y Potencial de Acción</text>
  
  <!-- Axes -->
  <line x1="65" y1="70" x2="65" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="255" x2="365" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <text x="38" y="95" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+30 mV</text>
  <text x="38" y="160" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">0 mV</text>
  <text x="38" y="205" fill="#fbbf24" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" text-anchor="middle">-55 mV</text>
  <text x="38" y="235" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">-70 mV</text>
  
  <!-- Dashed reference lines -->
  <line x1="65" y1="90" x2="360" y2="90" stroke="#34d399" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="65" y1="156" x2="360" y2="156" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="65" y1="202" x2="360" y2="202" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="65" y1="230" x2="360" y2="230" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Action Potential Curve -->
  <path d="M 65 230 L 125 230 Q 145 230 155 202 L 195 90 Q 205 78 215 90 L 265 245 Q 285 262 310 230 L 360 230" fill="none" stroke="#f43f5e" stroke-width="3.5"/>
  
  <!-- Labels on curve -->
  <text x="95" y="222" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reposo</text>
  <text x="148" y="148" fill="#fbbf24" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="end">Despolarización (entra Na⁺)</text>
  <text x="242" y="148" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="start">Repolarización (sale K⁺)</text>
  <text x="210" y="300" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Bomba Na⁺/K⁺ (3 Na⁺ afuera / 2 K⁺ adentro con ATP)</text>
  <text x="210" y="320" fill="#a78bfa" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ley de Todo o Nada: supera el umbral o no se dispara</text>

  <!-- Right: Conducción Saltatoria vs Continua y Corazón -->
  <rect x="410" y="20" width="370" height="320" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="595" y="45" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Conducción Saltatoria (Mielina) y Corazón</text>
  
  <!-- Myelinated Axon -->
  <text x="595" y="72" fill="#fde047" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Axón Mielínico: hasta 100 m/s (Salta Nodos de Ranvier)</text>
  <rect x="435" y="102" width="320" height="16" rx="4" fill="#64748b"/>
  <!-- Myelin sheaths -->
  <rect x="450" y="92" width="60" height="36" rx="8" fill="#facc15" stroke="#fef08a" stroke-width="1.5"/>
  <rect x="530" y="92" width="60" height="36" rx="8" fill="#facc15" stroke="#fef08a" stroke-width="1.5"/>
  <rect x="610" y="92" width="60" height="36" rx="8" fill="#facc15" stroke="#fef08a" stroke-width="1.5"/>
  <rect x="690" y="92" width="50" height="36" rx="8" fill="#facc15" stroke="#fef08a" stroke-width="1.5"/>
  <!-- Saltatory jumps -->
  <path d="M 442 92 Q 480 62 520 92" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 520 92 Q 560 62 600 92" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 600 92 Q 640 62 680 92" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="595" y="146" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Mielina = Aislante eléctrico (lípido) · Amielínica ≈ 10 m/s</text>

  <!-- Conducción Cardíaca y ECG -->
  <rect x="430" y="165" width="330" height="155" rx="10" fill="#070b24" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="595" y="188" fill="#f43f5e" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sistema Cardionector y Electrocardiograma (ECG)</text>
  <path d="M 450 245 L 485 245 Q 495 230 505 245 L 520 245 L 528 258 L 538 198 L 548 268 L 558 245 L 585 245 Q 605 222 625 245 L 740 245" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <text x="495" y="225" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Onda P</text>
  <text x="538" y="193" fill="#facc15" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Complejo QRS</text>
  <text x="605" y="222" fill="#a78bfa" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Onda T</text>
  <text x="595" y="285" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">1. Nodo Sinoauricular (Marcapasos: ~80 lat/min)</text>
  <text x="595" y="303" fill="#94a3b8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">2. Nodo AV → 3. Haz de His → 4. Fibras de Purkinje</text>

  <!-- Animated Action Potential Pulse & Saltatory Conduction Spark -->
  <circle r="6" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" filter="url(#neonGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 65 230 L 125 230 Q 145 230 155 202 L 195 90 Q 205 78 215 90 L 265 245 Q 285 262 310 230 L 360 230" />
  </circle>
  <circle r="6.5" fill="#c084fc" stroke="#22d3ee" stroke-width="2" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 442 92 Q 480 56 520 92 Q 560 56 600 92 Q 640 56 680 92" />
  </circle>
  <circle r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5" filter="url(#neonGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 450 245 L 485 245 Q 495 230 505 245 L 520 245 L 528 258 L 538 198 L 548 268 L 558 245 L 585 245 Q 605 222 625 245 L 740 245" />
  </circle>

</svg>