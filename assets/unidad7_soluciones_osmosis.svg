<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="auto">
  <defs>
    <linearGradient id="cosmicBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06091e"/>
      <stop offset="50%" stop-color="#0c133a"/>
      <stop offset="100%" stop-color="#070a22"/>
    </linearGradient>
    <linearGradient id="cosmicPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090e2a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="350" rx="16" fill="url(#cosmicBg)" stroke="url(#neonBorder)" stroke-width="2"/>
  
  <!-- Left: Conversiones de Soluciones -->
  <rect x="20" y="20" width="375" height="310" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="207" y="46" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Mapa de Soluciones: st + sv = sc</text>
  
  <rect x="38" y="62" width="340" height="80" rx="8" fill="#070b24" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="52" y="84" fill="#fde047" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">• % P/P (% m/m):</text>
  <text x="165" y="84" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12">g de soluto en 100 g de solución</text>
  <text x="52" y="106" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">• % P/V (% m/v):</text>
  <text x="165" y="106" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12">g de soluto en 100 ml de solución</text>
  <text x="52" y="128" fill="#a78bfa" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold">• % V/V:</text>
  <text x="165" y="128" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12">ml de soluto en 100 ml de solución</text>

  <rect x="38" y="154" width="340" height="78" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="208" y="176" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Molaridad (M) = moles de st en 1000 ml (1 L) de sc</text>
  <text x="208" y="198" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11.5" text-anchor="middle">1 mol = 6,02 × 10²³ partículas  |  n = masa (g) / Masa Molar</text>
  <text x="208" y="218" fill="#fde047" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11.5" text-anchor="middle">Puentes: Densidad (δ = m/V) ↔ g y ml | Masa Molar ↔ g y mol</text>

  <rect x="38" y="244" width="340" height="70" rx="8" fill="#070b24" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="208" y="266" fill="#f43f5e" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Dilución: C₁ · V₁ = C₂ · V₂</text>
  <text x="208" y="286" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Al agregar solvente (agua), la cantidad de soluto se</text>
  <text x="208" y="302" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">mantiene constante y la concentración disminuye.</text>

  <!-- Right: Ósmosis y Tonicidad Celular -->
  <rect x="410" y="20" width="370" height="310" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="595" y="46" fill="#f43f5e" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ósmosis y Tonicidad en Glóbulos Rojos</text>
  <text x="595" y="66" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">El agua viaja de menor a mayor concentración de soluto</text>

  <!-- Isotónica -->
  <rect x="425" y="82" width="105" height="175" rx="8" fill="#0f172a" stroke="#34d399"/>
  <text x="477" y="102" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Isotónica</text>
  <circle cx="477" cy="155" r="28" fill="#ef4444" stroke="#fca5a5" stroke-width="3"/>
  <circle cx="477" cy="155" r="11" fill="#991b1b"/>
  <text x="477" y="210" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">Igual [soluto]</text>
  <text x="477" y="226" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" text-anchor="middle">Flujo neto = 0</text>
  <text x="477" y="242" fill="#94a3b8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="9.5" text-anchor="middle">(NaCl 0,9% P/V)</text>

  <!-- Hipertónica -->
  <rect x="542" y="82" width="105" height="175" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="594" y="102" fill="#f59e0b" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Hipertónica</text>
  <polygon points="594,127 604,138 618,136 610,150 620,164 605,166 594,180 583,166 568,164 578,150 570,136 584,138" fill="#b91c1c" stroke="#fca5a5" stroke-width="2"/>
  <text x="594" y="210" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">&gt; [soluto] afuera</text>
  <text x="594" y="226" fill="#fbbf24" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" text-anchor="middle">Sale H₂O de célula</text>
  <text x="594" y="242" fill="#94a3b8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="9.5" text-anchor="middle">(Crenación / se seca)</text>

  <!-- Hipotónica -->
  <rect x="659" y="82" width="105" height="175" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="711" y="102" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Hipotónica</text>
  <circle cx="711" cy="155" r="35" fill="#ef4444" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="5 2"/>
  <text x="711" y="210" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">&lt; [soluto] afuera</text>
  <text x="711" y="226" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" text-anchor="middle">Entra H₂O a célula</text>
  <text x="711" y="242" fill="#94a3b8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="9.5" text-anchor="middle">(Hemólisis / estalla)</text>

  <text x="595" y="285" fill="#fde047" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Presión Osmótica: presión hidrostática necesaria para</text>
  <text x="595" y="303" fill="#fde047" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">detener el flujo neto de agua a través de la membrana.</text>

  <!-- Animated Osmotic Water Flux Droplets -->
  <circle cx="477" cy="155" r="28" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="27;30;27" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#38bdf8" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 594 152 L 632 122" />
  </circle>
  <circle r="4" fill="#38bdf8" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 594 152 L 558 182" />
  </circle>
  <circle cx="711" cy="155" r="35" fill="none" stroke="#38bdf8" stroke-width="2.5">
    <animate attributeName="r" values="32;39;32" dur="1.9s" repeatCount="indefinite"/>
  </circle>

</svg>