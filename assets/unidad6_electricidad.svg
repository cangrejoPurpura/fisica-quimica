<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <linearGradient id="cosmicBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06091e"/>
      <stop offset="50%" stop-color="#0c133a"/>
      <stop offset="100%" stop-color="#070a22"/>
    </linearGradient>
    <linearGradient id="cosmicPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090e2a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <defs>
    <linearGradient id="bg6a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowPos" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowCur" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="16" fill="url(#cosmicBg)" stroke="url(#neonBorder)" stroke-width="2"/>
  
  <!-- Panel 1: Ley de Coulomb y Campo Eléctrico -->
  <rect x="20" y="20" width="240" height="320" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="140" y="46" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Ley de Coulomb y Campo</text>
  
  <!-- Carga Positiva -->
  <circle cx="85" cy="125" r="22" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  <text x="85" y="132" fill="#ffffff" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">+</text>
  <text x="85" y="165" fill="#fca5a5" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Catión (+q₁)</text>
  
  <!-- Carga Negativa -->
  <circle cx="195" cy="125" r="22" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  <text x="195" y="132" fill="#ffffff" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">−</text>
  <text x="195" y="165" fill="#93c5fd" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Anión (−q₂)</text>
  
  <!-- Líneas de fuerza (de + a -) -->
  <path d="M 107 125 L 168 125" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowPos)"/>
  <path d="M 102 108 Q 140 75 176 108" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowPos)"/>
  <path d="M 102 142 Q 140 175 176 142" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowPos)"/>
  
  <!-- Distancia d -->
  <line x1="85" y1="190" x2="195" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="140" y="206" fill="#e2e8f0" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" text-anchor="middle">Distancia (d)</text>
  
  <rect x="35" y="225" width="210" height="95" rx="8" fill="#070b24" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="140" y="248" fill="#f8fafc" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">F = k · |q₁ · q₂| / d²</text>
  <text x="140" y="268" fill="#94a3b8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">k = 8,99 × 10⁹ N·m²/C²</text>
  <text x="140" y="286" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Signos opuestos: se atraen</text>
  <text x="140" y="304" fill="#f43f5e" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Signos iguales: se repelen</text>

  <!-- Panel 2: Circuito en Serie vs Paralelo -->
  <rect x="275" y="20" width="250" height="320" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="400" y="46" fill="#facc15" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Circuitos: Serie vs. Paralelo</text>
  
  <!-- Serie -->
  <text x="400" y="72" fill="#fde047" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Circuito en Serie (R_eq = R₁ + R₂)</text>
  <rect x="305" y="85" width="190" height="65" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="335" y="77" width="45" height="16" rx="3" fill="#f59e0b" stroke="#fef08a"/>
  <text x="357" y="89" fill="#0f172a" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R₁</text>
  <rect x="415" y="77" width="45" height="16" rx="3" fill="#f59e0b" stroke="#fef08a"/>
  <text x="437" y="89" fill="#0f172a" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R₂</text>
  <circle cx="400" cy="150" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="154" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">V</text>
  <text x="400" y="176" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Misma corriente I · V se reparte</text>

  <!-- Paralelo -->
  <text x="400" y="204" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Circuito en Paralelo (Domiciliario 220V)</text>
  <rect x="305" y="218" width="190" height="80" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="305" y1="258" x2="495" y2="258" stroke="#94a3b8" stroke-width="2"/>
  <rect x="375" y="210" width="50" height="16" rx="3" fill="#10b981" stroke="#a7f3d0"/>
  <text x="400" y="222" fill="#0f172a" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R₁</text>
  <rect x="375" y="250" width="50" height="16" rx="3" fill="#10b981" stroke="#a7f3d0"/>
  <text x="400" y="262" fill="#0f172a" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R₂</text>
  <circle cx="400" cy="298" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="302" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">V</text>
  <text x="400" y="325" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="middle">Misma tensión V (220V) · I se divide</text>

  <!-- Panel 3: Triángulo de Ohm, Efecto Joule y Seguridad -->
  <rect x="540" y="20" width="240" height="320" rx="12" fill="url(#cosmicPanel)" stroke="url(#neonBorder)" stroke-width="1.5"/>
  <text x="660" y="46" fill="#f43f5e" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Ohm, Joule y Seguridad</text>
  
  <!-- Triángulo de Ohm -->
  <polygon points="660,62 605,148 715,148" fill="#0f172a" stroke="#facc15" stroke-width="2.5"/>
  <line x1="632" y1="106" x2="688" y2="106" stroke="#facc15" stroke-width="2"/>
  <line x1="660" y1="106" x2="660" y2="148" stroke="#facc15" stroke-width="2"/>
  <text x="660" y="96" fill="#facc15" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">V</text>
  <text x="642" y="136" fill="#38bdf8" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">I</text>
  <text x="678" y="136" fill="#f43f5e" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">R</text>
  
  <rect x="555" y="162" width="210" height="162" rx="8" fill="#070b24" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="660" y="184" fill="#f8fafc" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Efecto Joule: E = R · I² · t</text>
  <text x="660" y="204" fill="#facc15" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Potencia: P = V · I = E / t</text>
  <line x1="570" y1="216" x2="750" y2="216" stroke="#334155"/>
  <text x="660" y="236" fill="#34d399" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Disyuntor Diferencial (40 mA):</text>
  <text x="660" y="252" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">Protege a las PERSONAS (corta si</text>
  <text x="660" y="266" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">I_entrada ≠ I_salida, evita paro).</text>
  <text x="660" y="288" fill="#fb923c" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Llave Térmica:</text>
  <text x="660" y="304" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">Protege CABLES/INSTALACIÓN del</text>
  <text x="660" y="318" fill="#cbd5e1" font-family="Space Grotesk, Plus Jakarta Sans, sans-serif" font-size="10.5" text-anchor="middle">sobrecalentamiento por Efecto Joule.</text>

  <!-- Animated Quantum Electrons & Field Pulses -->
  <circle r="4.5" fill="#22d3ee" filter="url(#neonGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 102 108 Q 140 75 176 108" />
  </circle>
  <circle r="4.5" fill="#22d3ee" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 107 125 L 168 125" />
  </circle>
  <circle r="4.5" fill="#22d3ee" filter="url(#neonGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 102 142 Q 140 175 176 142" />
  </circle>
  <!-- Flowing current in Series circuit -->
  <circle r="4" fill="#fde047" filter="url(#neonGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 305 85 L 495 85 L 495 150 L 305 150 Z" />
  </circle>
  <!-- Flowing current in Parallel circuit -->
  <circle r="4" fill="#34d399" filter="url(#neonGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 305 218 L 495 218 L 495 298 L 305 298 Z" />
  </circle>
  <circle r="4" fill="#22d3ee" filter="url(#neonGlow)">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M 305 258 L 495 258 L 495 298 L 305 298 Z" />
  </circle>

</svg>